<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📚 Library Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">🏠 Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/books}">📖 Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/members}">👥 Members</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/borrowings}">📋 Borrowings</a>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/settings}">⚙️ Settings</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
                    <li class="breadcrumb-item active">Add New Book</li>
                </ol>
            </nav>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                ❌ <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">➕ Add New Book</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/books/add}" th:object="${book}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="isbn" class="form-label">ISBN *</label>
                                <input type="text" class="form-control" id="isbn"
                                       th:field="*{isbn}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category *</label>
                                <input class="form-control" id="category" list="book-categories" th:field="*{category}" placeholder="e.g. Fiction, Science" required>
                                <datalist id="book-categories"><option th:each="item : ${categories}" th:value="${item}"></option></datalist>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="title" class="form-label">Title *</label>
                            <input type="text" class="form-control" id="title"
                                   th:field="*{title}" required>
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Author *</label>
                            <input type="text" class="form-control" id="author"
                                   th:field="*{author}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="publisher" class="form-label">Publisher</label>
                                <input type="text" class="form-control" id="publisher"
                                       th:field="*{publisher}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="publicationYear" class="form-label">Publication Year</label>
                                <input type="number" class="form-control" id="publicationYear"
                                       th:field="*{publicationYear}" min="1000" max="2099">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="totalCopies" class="form-label">Total Copies *</label>
                                <input type="number" class="form-control" id="totalCopies"
                                       th:field="*{totalCopies}" min="1" required>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label for="shelfLocation" class="form-label">Shelf Location</label>
                                <input type="text" class="form-control" id="shelfLocation"
                                       th:field="*{shelfLocation}" placeholder="e.g., A1-001">
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/books}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">💾 Save Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer mt-5 py-3 bg-light">
    <div class="container text-center">
        <span class="text-muted">© 2026 Robin's Library Management System</span>
    </div>
</footer>

<!-- Bootstrap JS -->
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
