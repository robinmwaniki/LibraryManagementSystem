
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Book - Library Management</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📚 Library Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">🏠 Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">📖 Books</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">👥 Members</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/borrowings}">📋 Borrowings</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        ✅ <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        ❌ <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-hand-holding me-2"></i>Borrow a Book
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/borrowings/borrow}" method="post">
                        <div class="mb-4">
                            <label for="bookId" class="form-label">Select Book</label>
                            <select class="form-select" id="bookId" name="bookId" required>
                                <option value="">Choose a book...</option>
                                <option th:each="book : ${availableBooks}"
                                        th:value="${book.id}"
                                        th:text="${book.title + ' by ' + book.author + ' (Available: ' + book.availableCopies + ')'}"
                                        th:selected="${bookId != null && bookId == book.id}">
                                    Book Title
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="memberId" class="form-label">Select Member</label>
                            <select class="form-select" id="memberId" name="memberId" required>
                                <option value="">Choose a member...</option>
                                <option th:each="member : ${activeMembers}"
                                        th:value="${member.id}"
                                        th:text="${member.firstName + ' ' + member.lastName + ' (' + member.email + ')'}">
                                    Member Name
                                </option>
                            </select>
                        </div>

                        <div class="alert alert-info">
                            <h6><i class="fas fa-info-circle me-2"></i>Borrowing Rules:</h6>
                            <ul class="mb-0">
                                <li>Borrowing period is 14 days</li>
                                <li>Late return fine: Ksh 1.00 per day</li>
                                <li>Maximum books per member: 5</li>
                                <li>Members must have active status</li>
                            </ul>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/borrowings}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check me-1"></i>Confirm Borrow
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer mt-5 py-3 bg-light">
    <div class="container text-center">
        <span class="text-muted">© 2026 Robin's Library Management System</span>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
