<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Library Management</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="card border-0 shadow-sm" style="width:100%;max-width:420px"><div class="card-body p-4 p-md-5">
<div class="fw-semibold text-primary mb-2">LIBRARY MANAGEMENT</div>
<h1 class="h3 mb-2">Welcome back</h1><p class="text-secondary mb-4">Sign in to manage your library.</p>
<div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid username or password.</div>
<div th:if="${param.logout}" class="alert alert-success" role="alert">You have signed out.</div>
<form th:action="@{/login}" method="post">
<div class="mb-3"><label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control" autocomplete="username" required autofocus></div>
<div class="mb-4"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
<button type="submit" class="btn btn-primary w-100">Sign in</button>
</form></div></div></main></body></html>
