spring.application.name=LibraryManagementSystem

# Application
server.port=8080

# ============================================
# MySQL Database Configuration (XAMPP)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Logging
# ============================================
logging.level.com.library=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# Thymeleaf
# ============================================
spring.thymeleaf.cache=false

# ============================================
# Allow HTML forms to send PUT/DELETE via a hidden _method field
# ============================================
spring.mvc.hiddenmethod.filter.enabled=true

# ============================================
# Manager password for the /settings page
# CHANGE THIS to your own password
# ============================================
library.manager.password=admin123