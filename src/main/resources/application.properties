spring.application.name=LibraryManagementSystem
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
library.security.admin.username=${LIBRARY_ADMIN_USERNAME:admin}
library.security.admin.password=${LIBRARY_ADMIN_PASSWORD:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
library.notifications.enabled=${LIBRARY_NOTIFICATIONS_ENABLED:false}
library.notifications.reminder-cron=${LIBRARY_REMINDER_CRON:0 0 8 * * *}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.hiddenmethod.filter.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
logging.level.com.example.librarymanagementsystem=${APP_LOG_LEVEL:INFO}
