spring.application.name=LibraryManagementSystem
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL connection (local defaults; Docker Compose overrides DB_HOST).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase is the sole owner of production schema changes.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

library.security.admin.username=${LIBRARY_ADMIN_USERNAME:admin}
library.security.admin.password=${LIBRARY_ADMIN_PASSWORD:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
library.notifications.enabled=${LIBRARY_NOTIFICATIONS_ENABLED:false}
library.notifications.from=${MAIL_FROM:}
library.notifications.reminder-cron=${LIBRARY_REMINDER_CRON:0 0 8 * * *}

# A ready reservation is held for three days by default; expiry checks run hourly.
library.reservations.expiry-days=${LIBRARY_RESERVATION_EXPIRY_DAYS:3}
library.reservations.expiry-check-cron=${LIBRARY_RESERVATION_EXPIRY_CRON:0 0 * * * *}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.mvc.hiddenmethod.filter.enabled=true
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${LIBRARY_NOTIFICATIONS_ENABLED:false}
management.endpoint.health.show-details=when_authorized
logging.level.com.example.librarymanagementsystem=${APP_LOG_LEVEL:INFO}
