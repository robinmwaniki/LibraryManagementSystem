databaseChangeLog:
  - changeSet:
      id: 001-create-books
      author: robinmwaniki
      changes:
        - createTable:
            tableName: books
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_books, nullable: false } }
              - column: { name: title, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: author, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: isbn, type: VARCHAR(255) }
              - column: { name: publisher, type: VARCHAR(255) }
              - column: { name: publication_year, type: INT }
              - column: { name: category, type: VARCHAR(255) }
              - column: { name: total_copies, type: INT, constraints: { nullable: false } }
              - column: { name: available_copies, type: INT }
              - column: { name: shelf_location, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP }
        - addUniqueConstraint:
            tableName: books
            columnNames: isbn
            constraintName: uk_books_isbn
        - createIndex:
            tableName: books
            indexName: idx_books_title
            columns:
              - column: { name: title }
        - createIndex:
            tableName: books
            indexName: idx_books_author
            columns:
              - column: { name: author }

  - changeSet:
      id: 002-create-members
      author: robinmwaniki
      changes:
        - createTable:
            tableName: members
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_members, nullable: false } }
              - column: { name: first_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: last_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: email, type: VARCHAR(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_members_email } }
              - column: { name: phone, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: address, type: VARCHAR(255) }
              - column: { name: status, type: VARCHAR(255), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: max_books_allowed, type: INT, defaultValueNumeric: 5 }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP }

  - changeSet:
      id: 003-create-library-settings
      author: robinmwaniki
      changes:
        - createTable:
            tableName: library_settings
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, primaryKeyName: pk_library_settings, nullable: false } }
              - column: { name: loan_period_days, type: INT, defaultValueNumeric: 14, constraints: { nullable: false } }
              - column: { name: fine_per_day, type: DOUBLE PRECISION, defaultValueNumeric: 1.0, constraints: { nullable: false } }
              - column: { name: max_fine, type: DOUBLE PRECISION }
        - insert:
            tableName: library_settings
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: loan_period_days, valueNumeric: 14 }
              - column: { name: fine_per_day, valueNumeric: 1.0 }

  - changeSet:
      id: 004-create-borrowing-records
      author: robinmwaniki
      changes:
        - createTable:
            tableName: borrowing_records
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_borrowing_records, nullable: false } }
              - column: { name: book_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_borrowings_book, references: books(id) } }
              - column: { name: member_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_borrowings_member, references: members(id) } }
              - column: { name: borrow_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: due_date, type: TIMESTAMP }
              - column: { name: return_date, type: TIMESTAMP }
              - column: { name: status, type: VARCHAR(255), defaultValue: BORROWED, constraints: { nullable: false } }
              - column: { name: fine, type: DOUBLE PRECISION }
              - column: { name: renewal_count, type: INT, defaultValueNumeric: 0 }
              - column: { name: last_reminder_sent_at, type: TIMESTAMP }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: updated_at, type: TIMESTAMP }
        - createIndex:
            tableName: borrowing_records
            indexName: idx_borrowings_due_status
            columns:
              - column: { name: status }
              - column: { name: due_date }
        - createIndex:
            tableName: borrowing_records
            indexName: idx_borrowings_member
            columns:
              - column: { name: member_id }
        - createIndex:
            tableName: borrowing_records
            indexName: idx_borrowings_book
            columns:
              - column: { name: book_id }
