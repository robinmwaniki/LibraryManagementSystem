spring.datasource.url=jdbc:h2:mem:librarytest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
library.security.admin.username=test-admin
library.security.admin.password=test-password
library.notifications.enabled=false
spring.thymeleaf.cache=false
